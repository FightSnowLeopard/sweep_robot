joy_node:
    ros__parameters:
      deadzone: 0.05
      autorepeat_rate: 20.0


teleop_node:
    ros__parameters:

      enable_button: 9
      enable_turbo_button: 1
      require_enable_button: true


      scale_linear:
        x: 0.5
      scale_linear_turbo:
        x: 1.0
      axis_linear:
        x: 1
      axis_angular:
        yaw: 0
      scale_angular:
        yaw: 0.5
      scale_angular_turbo:
        yaw: 1.0